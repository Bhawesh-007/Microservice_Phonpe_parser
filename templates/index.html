<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Statement</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

    <div class="max-w-5xl mx-auto pt-12 px-4 pb-20">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">AI Statement Analyzer</h1>
            <p class="text-gray-500 mt-2">Upload your PhonePe statement to automatically categorize your expenses.</p>
        </div>

        <div id="upload-section" class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 text-center">
            <input type="file" id="file-input" accept=".pdf" class="hidden" />
            <button onclick="document.getElementById('file-input').click()"
                class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">
                Select PDF File
            </button>
            <p id="file-name" class="mt-4 text-sm text-gray-500"></p>
            <button id="process-btn" onclick="uploadFile()"
                class="hidden mt-4 mx-auto px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors">
                Analyze Transactions
            </button>
        </div>

        <div id="loading" class="hidden text-center mt-12">
            <div
                class="inline-block animate-spin w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mb-4">
            </div>
            <p class="text-gray-600 font-medium animate-pulse">AI is reading your statement...</p>
        </div>

        <div id="results-section"
            class="hidden mt-8 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-xl font-bold">Review & Edit Data</h2>
                <span id="transaction-count"
                    class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded"></span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-500 uppercase bg-gray-50">
                        <tr>
                            <th class="px-6 py-3">Date</th>
                            <th class="px-6 py-3">Merchant</th>
                            <th class="px-6 py-3">Amount (₹)</th>
                            <th class="px-6 py-3">Category (Editable)</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-100">
                    </tbody>
                </table>
            </div>
            <div class="p-6 bg-gray-50 text-right border-t border-gray-100">
                <button onclick="downloadJSON()"
                    class="px-6 py-3 bg-gray-900 hover:bg-black text-white rounded-lg font-medium shadow-md transition">
                    Approve & Download JSON
                </button>
            </div>
        </div>
    </div>

    <script>
        // Get the categories mapped directly from Python!
        // We use Jinja's tojson filter to make it a valid JavaScript object.
        const categoriesMap = {{ categories | tojson | safe }};
        let parsedData = [];

        // File Selection Listener
        document.getElementById('file-input').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('file-name').innerText = "Selected: " + file.name;
                document.getElementById('process-btn').classList.remove('hidden');
            }
        });

        // Send PDF to Python Microservice
        async function uploadFile() {
            const fileInput = document.getElementById('file-input');
            if (!fileInput.files[0]) return;

            document.getElementById('upload-section').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const response = await fetch('/parser/process', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.status === "success") {
                    parsedData = result.data;
                    renderTable(parsedData);
                } else {
                    alert("Error: " + (result.detail || "Something went wrong"));
                }
            } catch (error) {
                console.error(error);
                alert("Server Error. Check your Python terminal for the crash trace.");
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        // Render Data into Editable Table
        function renderTable(data) {
            document.getElementById('results-section').classList.remove('hidden');
            document.getElementById('transaction-count').innerText = `${data.length} Transactions Found`;

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            data.forEach((txn, index) => {
                const dateObj = new Date(txn.timestamp);
                const dateString = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Build the Dropdown options based on the Python dictionary
                let dropdownOptions = '';
                for (const [catName, catId] of Object.entries(categoriesMap)) {
                    // Check if this option matches what the AI guessed
                    const isSelected = txn.categoryId === catId ? "selected" : "";
                    dropdownOptions += `<option value="${catId}" ${isSelected}>${catName}</option>`;
                }

                const row = `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 whitespace-nowrap">${dateString}</td>
                        <td class="px-6 py-4 font-medium text-gray-900">${txn.note}</td>
                        <td class="px-6 py-4 font-bold text-red-600">-₹${txn.amount}</td>
                        <td class="px-6 py-4 w-48">
                            <select class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 outline-none" 
                                    onchange="updateCategory(${index}, this.value, this.options[this.selectedIndex].text)">
                                ${dropdownOptions}
                            </select>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // Update the internal data array when user changes the dropdown
        function updateCategory(index, newId, newName) {
            parsedData[index].categoryId = parseInt(newId);
            parsedData[index].categoryName = newName;
        }

        // Create a downloadable JSON file containing the approved data
        function downloadJSON() {
            if (parsedData.length === 0) {
                alert("No data to download!");
                return;
            }

            // Convert our modified data array back into a pretty string
            const dataStr = JSON.stringify({ "status": "approved", "data": parsedData }, null, 2);

            // Create a Blob (a chunk of file memory)
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);

            // Create an invisible anchor tag, click it, and delete it
            const a = document.createElement('a');
            a.href = url;
            a.download = `approved_expenses_${new Date().getTime()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>

</html>
